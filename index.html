<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BukkenMemo">
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%231e293b%22/><path d=%22M50 20c-11.04 0-20 8.96-20 20 0 15 20 40 20 40s20-25 20-40c0-11.04-8.96-20-20-20zm0 27c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z%22 fill=%22white%22/></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%231e293b%22/><path d=%22M50 20c-11.04 0-20 8.96-20 20 0 15 20 40 20 40s20-25 20-40c0-11.04-8.96-20-20-20zm0 27c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z%22 fill=%22white%22/></svg>">
  <title>BukkenMemo</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: #f4f4f5; 
      color: #334155; 
      overscroll-behavior-y: none;
    }
    .env-safe-top { padding-top: var(--safe-top); }
    .pb-safe { padding-bottom: calc(var(--safe-bottom) + 80px); }
    
    #map { 
      flex: 1;
      width: 100%;
      min-height: 0; 
      z-index: 10; 
    }
    
    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
      padding: 0;
    }
    .leaflet-popup-content {
      margin: 14px;
      min-width: 240px;
    }
    .leaflet-container a.leaflet-popup-close-button {
      color: #94a3b8;
      padding: 6px;
    }
    .custom-div-icon {
      background: transparent;
      border: none;
    }
    
    .leaflet-control-layers {
      border-radius: 12px !important;
      border: none !important;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06) !important;
      overflow: hidden;
    }
    .leaflet-control-layers-toggle {
      width: 40px !important;
      height: 40px !important;
      background-size: 20px 20px !important;
    }
    .leaflet-control-layers-list {
      padding: 8px 12px;
      font-size: 13px;
      color: #334155;
      font-weight: 500;
    }
    .leaflet-control-layers-base label {
      margin-bottom: 6px;
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body class="h-screen w-full flex flex-col overflow-hidden">

  <header class="bg-slate-800 text-white shadow-md z-20 relative env-safe-top">
    <div class="flex justify-between items-center px-4 py-3">
      <h1 class="text-lg font-bold tracking-wider"><i class="fa-solid fa-map-location-dot mr-2"></i>BukkenMemo</h1>
      <button onclick="window.locateMe()" class="text-slate-200 hover:text-white transition p-2">
        <i class="fa-solid fa-location-crosshairs text-xl"></i>
      </button>
    </div>
  </header>

  <main class="flex-1 relative overflow-hidden flex flex-col">
    <!-- マップ画面 -->
    <div id="view-map" class="absolute inset-0 flex flex-col z-10 transition-opacity duration-300">
      
      <!-- 住所検索バー -->
      <div class="absolute top-3 left-3 right-16 z-[1000] pointer-events-auto">
        <div class="flex bg-white rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.1)] overflow-hidden border border-slate-200/60">
          <input type="text" id="map-search-input" placeholder="住所・施設名で検索" class="flex-1 px-4 py-3 text-[13px] text-slate-800 outline-none w-full bg-white/90 focus:bg-white transition-colors" onkeypress="if(event.key==='Enter') window.searchAddress()">
          <button onclick="window.searchAddress()" id="map-search-btn" class="px-4 py-2 text-slate-500 hover:text-slate-800 bg-slate-50/90 hover:bg-slate-100 transition-colors border-l border-slate-100">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>
      </div>

      <!-- マップ本体 -->
      <div id="map" class="w-full flex-1 min-h-0"></div>

      <!-- 住所表示＆新規登録パネル -->
      <div class="bg-white px-4 py-3 shadow-[0_-4px_10px_rgba(0,0,0,0.05)] z-[1000] flex flex-col shrink-0 pb-[env(safe-area-inset-bottom,0px)]">
        <div class="mb-2">
          <p class="text-[10px] font-bold text-slate-400 mb-0.5">新規登録ピンの位置</p>
          <div class="flex items-center">
            <p id="current-address" class="text-sm font-bold text-slate-800 line-clamp-2 leading-tight transition-opacity min-h-[1.25rem]">位置情報を取得中...</p>
            <i id="loading-address" class="fa-solid fa-spinner fa-spin text-slate-400 ml-2 hidden"></i>
          </div>
        </div>
        <button onclick="window.openFormModal()" class="w-full py-3.5 bg-slate-800 text-white font-bold rounded-xl shadow-md active:scale-95 transition-transform flex justify-center items-center text-sm mb-1 whitespace-nowrap overflow-hidden">
          <i class="fa-solid fa-pen-to-square mr-2 shrink-0"></i><span class="truncate">登録</span>
        </button>
      </div>
    </div>

    <!-- リスト画面 -->
    <div id="view-list" class="absolute inset-0 bg-zinc-50 z-0 opacity-0 pointer-events-none transition-opacity duration-300 overflow-y-auto pb-safe">
      <div class="p-4">
        <div class="flex justify-between items-center mb-4 mt-2">
          <h2 class="text-lg font-bold text-slate-800">登録済み物件</h2>
          <span id="list-count" class="text-xs font-bold bg-slate-200 text-slate-600 px-2 py-1 rounded-full">0件</span>
        </div>
        <div id="property-list" class="space-y-3 overflow-x-hidden"></div>
      </div>
    </div>

    <!-- ゴミ箱画面 -->
    <div id="view-trash" class="absolute inset-0 bg-zinc-50 z-0 opacity-0 pointer-events-none transition-opacity duration-300 overflow-y-auto pb-safe">
      <div class="p-4">
        <div class="flex justify-between items-center mb-4 mt-2">
          <h2 class="text-lg font-bold text-slate-800">ゴミ箱</h2>
          <button onclick="window.emptyTrash()" class="text-xs font-bold bg-red-100 text-red-600 px-3 py-1.5 rounded-lg hover:bg-red-200 transition-colors shadow-sm">
            <i class="fa-solid fa-ban mr-1"></i>全て削除
          </button>
        </div>
        <p class="text-xs text-slate-500 mb-4 bg-white p-3 rounded-lg border border-slate-200">
          <i class="fa-solid fa-circle-info mr-1"></i>リスト画面で物件を左にスワイプするとゴミ箱に移動できます。
        </p>
        <div id="trash-list" class="space-y-3"></div>
      </div>
    </div>

    <!-- バックアップ画面 -->
    <div id="view-backup" class="absolute inset-0 bg-zinc-50 z-0 opacity-0 pointer-events-none transition-opacity duration-300 overflow-y-auto pb-safe">
      <div class="p-4 mt-2">
        <h2 class="text-lg font-bold text-slate-800 mb-4">データ管理</h2>
        
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-zinc-200 mb-4">
          <h3 class="text-sm font-bold text-slate-800 mb-3"><i class="fa-solid fa-download text-slate-500 mr-2"></i>エクスポート (保存)</h3>
          <p class="text-xs text-slate-500 mb-4 leading-relaxed">
            登録したデータを保存します。バックアップとして定期的に保存することをおすすめします。
          </p>
          <div class="space-y-2">
            <button onclick="window.exportData('json')" class="w-full py-3 bg-slate-100 text-slate-800 font-bold rounded-xl text-sm flex items-center justify-center border border-slate-200 active:bg-slate-200">
              <i class="fa-solid fa-file-code mr-2"></i>JSON形式で保存（復元用）
            </button>
            <button onclick="window.exportData('csv')" class="w-full py-3 bg-slate-100 text-slate-800 font-bold rounded-xl text-sm flex items-center justify-center border border-slate-200 active:bg-slate-200">
              <i class="fa-solid fa-file-csv mr-2"></i>CSV形式で保存（Excel用）
            </button>
          </div>
        </div>

        <div class="bg-white p-5 rounded-2xl shadow-sm border border-zinc-200">
          <h3 class="text-sm font-bold text-slate-800 mb-3"><i class="fa-solid fa-upload text-slate-500 mr-2"></i>インポート (復元)</h3>
          <p class="text-xs text-slate-500 mb-4 leading-relaxed">
            保存したJSONファイルからデータを復元します。
          </p>
          <label class="w-full py-3 bg-slate-800 text-white font-bold rounded-xl text-sm flex items-center justify-center shadow-md active:scale-95 transition-transform cursor-pointer">
            <i class="fa-solid fa-folder-open mr-2"></i>ファイルを選択
            <input type="file" accept=".json" class="hidden" onchange="window.importData(event)">
          </label>
        </div>
      </div>
    </div>
  </main>

  <nav class="bg-white border-t border-zinc-200 z-30 shrink-0 pb-[env(safe-area-inset-bottom,0px)] relative">
    <div class="flex justify-around items-center h-16">
      <button onclick="window.switchTab('map')" id="tab-map" class="tab-btn flex-1 flex flex-col items-center justify-center text-slate-800 transition-colors">
        <i class="fa-solid fa-map text-xl mb-1"></i>
        <span class="text-[10px] font-bold mt-1">マップ</span>
      </button>
      <button onclick="window.switchTab('list')" id="tab-list" class="tab-btn flex-1 flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 transition-colors">
        <i class="fa-solid fa-list text-xl mb-1"></i>
        <span class="text-[10px] font-bold mt-1">リスト</span>
      </button>
      <button onclick="window.switchTab('trash')" id="tab-trash" class="tab-btn flex-1 flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 transition-colors">
        <i class="fa-solid fa-trash-can text-xl mb-1"></i>
        <span class="text-[10px] font-bold mt-1">ゴミ箱</span>
      </button>
      <button onclick="window.switchTab('backup')" id="tab-backup" class="tab-btn flex-1 flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 transition-colors">
        <i class="fa-solid fa-cloud-arrow-down text-xl mb-1"></i>
        <span class="text-[10px] font-bold mt-1">バックアップ</span>
      </button>
    </div>
  </nav>

  <div id="form-modal" class="fixed inset-0 bg-slate-900/60 z-50 hidden opacity-0 transition-opacity duration-300 flex items-end justify-center sm:items-center">
    <div class="bg-white w-full sm:w-[400px] h-[85vh] sm:h-auto sm:max-h-[90vh] rounded-t-3xl sm:rounded-3xl flex flex-col shadow-2xl transform translate-y-full sm:translate-y-0 transition-transform duration-300" id="form-content">
      <div class="flex justify-between items-center p-4 border-b border-zinc-100">
        <h3 class="text-lg font-bold text-slate-800" id="modal-title">物件を登録</h3>
        <button onclick="window.closeFormModal()" class="w-8 h-8 bg-zinc-100 rounded-full flex items-center justify-center text-slate-500 hover:bg-zinc-200 transition-colors">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="p-5 overflow-y-auto flex-1 space-y-5">
        <input type="hidden" id="form-id">
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1.5">物件名 / 施設名 <span class="text-red-500">*</span></label>
          <input type="text" id="form-name" placeholder="例: 〇〇交差点角地" class="w-full bg-zinc-50 border border-zinc-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-slate-800">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1.5">物件種別</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" class="type-btn border border-zinc-200 bg-white text-slate-600 rounded-xl py-2.5 text-xs font-bold transition-all data-[selected=true]:border-slate-800 data-[selected=true]:bg-slate-800 data-[selected=true]:text-white" data-value="ロードサイド物件" onclick="window.selectType(this)">ロードサイド物件</button>
            <button type="button" class="type-btn border border-zinc-200 bg-white text-slate-600 rounded-xl py-2.5 text-xs font-bold transition-all data-[selected=true]:border-slate-800 data-[selected=true]:bg-slate-800 data-[selected=true]:text-white" data-value="ビルイン物件" onclick="window.selectType(this)">ビルイン物件</button>
            <button type="button" class="type-btn border border-zinc-200 bg-white text-slate-600 rounded-xl py-2.5 text-xs font-bold transition-all data-[selected=true]:border-slate-800 data-[selected=true]:bg-slate-800 data-[selected=true]:text-white" data-value="地権者" onclick="window.selectType(this)">地権者</button>
            <button type="button" class="type-btn border border-zinc-200 bg-white text-slate-600 rounded-xl py-2.5 text-xs font-bold transition-all data-[selected=true]:border-slate-800 data-[selected=true]:bg-slate-800 data-[selected=true]:text-white" data-value="その他" onclick="window.selectType(this)">その他</button>
          </div>
          <input type="hidden" id="form-type" value="ロードサイド物件">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1.5">住所</label>
          <textarea id="form-address" rows="2" class="w-full bg-zinc-50 border border-zinc-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-slate-800"></textarea>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1.5">メモ</label>
          <textarea id="form-memo" rows="3" placeholder="視認性、坪単価など..." class="w-full bg-zinc-50 border border-zinc-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-slate-800"></textarea>
        </div>
      </div>
      <div class="p-4 border-t border-zinc-100 bg-white pb-[env(safe-area-inset-bottom,16px)]">
        <button id="save-submit-btn" onclick="window.saveProperty()" class="w-full py-3.5 bg-slate-800 text-white font-bold rounded-xl shadow-lg active:scale-95 transition-transform flex justify-center items-center">
          <i class="fa-solid fa-check mr-2"></i>保存する
        </button>
      </div>
    </div>
  </div>

  <!-- カスタムダイアログ -->
  <div id="dialog-modal" class="fixed inset-0 bg-slate-900/60 z-[9999] hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl transform scale-95 transition-transform duration-300" id="dialog-content">
      <p id="dialog-message" class="text-slate-800 text-sm font-medium mb-5 whitespace-pre-wrap leading-relaxed"></p>
      <div class="flex space-x-3 justify-end">
        <button id="dialog-cancel" class="px-4 py-2.5 bg-zinc-100 text-slate-600 text-sm font-bold rounded-xl hover:bg-zinc-200 transition-colors hidden">キャンセル</button>
        <button id="dialog-ok" class="px-4 py-2.5 bg-slate-800 text-white text-sm font-bold rounded-xl shadow-md active:scale-95 transition-transform">OK</button>
      </div>
    </div>
  </div>

  <script>
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    // カスタムダイアログ機能（標準のalert/confirmの代わり）
    let dialogConfirmCallback = null;
    function showDialog(message, isConfirm, callback = null) {
      const modal = document.getElementById('dialog-modal');
      const content = document.getElementById('dialog-content');
      document.getElementById('dialog-message').textContent = message;
      
      const cancelBtn = document.getElementById('dialog-cancel');
      if (isConfirm) {
        cancelBtn.classList.remove('hidden');
      } else {
        cancelBtn.classList.add('hidden');
      }
      dialogConfirmCallback = callback;
      
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        content.classList.remove('scale-95');
        content.classList.add('scale-100');
      }, 10);
    }
    function closeDialog() {
      const modal = document.getElementById('dialog-modal');
      const content = document.getElementById('dialog-content');
      modal.classList.add('opacity-0');
      content.classList.remove('scale-100');
      content.classList.add('scale-95');
      setTimeout(() => { modal.classList.add('hidden'); }, 300);
    }
    document.getElementById('dialog-cancel').addEventListener('click', closeDialog);
    document.getElementById('dialog-ok').addEventListener('click', () => {
      closeDialog();
      if (dialogConfirmCallback) dialogConfirmCallback();
    });
    function customAlert(message) { showDialog(message, false); }
    function customConfirm(message, onConfirmCallback) { showDialog(message, true, onConfirmCallback); }

    let map, marker;
    let savedMarkersLayer; 
    let currentLocation = { lat: 35.681236, lng: 139.767125, address: '現在地を取得中...' };
    let properties = JSON.parse(localStorage.getItem('storeProperties') || '[]');
    let currentTab = 'map';
    let geocodeSeq = 0;
    let geoTimer = null;

    function initApp() {
      if (map) return; 
      initMap();
      renderList();
      renderTrash();
      initSwipeLogic();
      
      const firstTypeBtn = document.querySelector('.type-btn');
      if (firstTypeBtn) {
          firstTypeBtn.setAttribute('data-selected', 'true');
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
    window.onload = initApp;

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([currentLocation.lat, currentLocation.lng], 15);
      
      const gsiStd = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: "<a href='https://maps.gsi.go.jp/development/ichiran.html' target='_blank'>地理院タイル</a>"
      });
      const googleMap = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        attribution: "&copy; Google"
      });
      const googleSatellite = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        attribution: "&copy; Google"
      });

      gsiStd.addTo(map);

      const baseMaps = {
        "国土地理院マップ": gsiStd,
        "Google マップ": googleMap,
        "航空写真": googleSatellite
      };
      L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);
      L.control.zoom({ position: 'bottomright' }).addTo(map);
      savedMarkersLayer = L.layerGroup().addTo(map);

      const targetIcon = L.divIcon({
        html: `<div class="w-9 h-9 bg-slate-800 rounded-full flex justify-center items-center shadow-xl border-[3px] border-white"><i class="fa-solid fa-crosshairs text-white text-sm"></i></div>`,
        className: 'custom-div-icon',
        iconSize: [36, 36],
        iconAnchor: [18, 36]
      });

      marker = L.marker([currentLocation.lat, currentLocation.lng], {
        icon: targetIcon,
        draggable: true,
        zIndexOffset: 1000 
      }).addTo(map);

      marker.on('dragend', function (e) {
        const pos = marker.getLatLng();
        updateCurrentLocation(pos.lat, pos.lng);
      });

      map.on('click', function (e) {
        marker.setLatLng(e.latlng);
        updateCurrentLocation(e.latlng.lat, e.latlng.lng);
      });

      renderMapMarkers();
      locateMe();
    }

    function updateCurrentLocation(lat, lng) {
      currentLocation.lat = lat;
      currentLocation.lng = lng;
      clearTimeout(geoTimer);
      geoTimer = setTimeout(() => reverseGeocode(lat, lng), 600);
    }

    async function reverseGeocode(lat, lng) {
      const mySeq = ++geocodeSeq;
      const addrEl = document.getElementById('current-address');
      const loader = document.getElementById('loading-address');
      
      if(loader) loader.classList.remove('hidden');
      if(addrEl) addrEl.style.opacity = '0.5';

      try {
        const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=ja`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('Network error');
        const data = await res.json();
        
        if (mySeq !== geocodeSeq) return; 

        let formattedAddress = '';
        if (data.address) {
          const a = data.address;
          formattedAddress += (a.province || a.prefecture || '') + (a.city || a.town || a.village || a.county || '');
          formattedAddress += (a.suburb || a.quarter || '') + (a.neighbourhood || '');
          if (a.road) formattedAddress += ' ' + a.road;
          if (a.house_number) formattedAddress += ' ' + a.house_number;
          if (a.building || a.amenity) formattedAddress += ' ' + (a.building || a.amenity);
        }
        
        currentLocation.address = formattedAddress.trim() || `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      } catch (error) {
        if (mySeq !== geocodeSeq) return;
        currentLocation.address = `緯度: ${lat.toFixed(5)} 経度: ${lng.toFixed(5)}`;
      } finally {
        if (mySeq === geocodeSeq) {
          if(loader) loader.classList.add('hidden');
          if(addrEl) {
            addrEl.style.opacity = '1';
            addrEl.textContent = currentLocation.address;
          }
          
          const formAddress = document.getElementById('form-address');
          if (formAddress && !document.getElementById('form-modal').classList.contains('hidden')) {
             if(document.getElementById('form-id').value === '') {
                 formAddress.value = currentLocation.address;
             }
          }
        }
      }
    }

    window.locateMe = function() {
      const addrEl = document.getElementById('current-address');
      if (navigator.geolocation) {
        if(addrEl) addrEl.textContent = "GPSで現在地を取得中...";
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            map.setView([lat, lng], 17);
            marker.setLatLng([lat, lng]);
            updateCurrentLocation(lat, lng);
          },
          (error) => {
            console.warn("現在地取得エラー:", error);
            if(addrEl) addrEl.textContent = "地図をタップして位置を指定してください";
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      } else {
        if(addrEl) addrEl.textContent = "位置情報がサポートされていません";
      }
    };

    function renderMapMarkers() {
      savedMarkersLayer.clearLayers();

      const getCustomIcon = (type, flagged) => {
        let color = '#64748b'; 
        if (type === 'ロードサイド物件') color = '#10b981'; 
        if (type === 'ビルイン物件') color = '#3b82f6'; 
        if (type === '地権者') color = '#f59e0b'; 

        const htmlStr = `
          <div style="position:relative; width:40px; height:40px;">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="${color}" width="40px" height="40px"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/><circle cx="12" cy="9" r="2.5" fill="white"/></svg>
            ${flagged ? '<div class="absolute -top-1 -right-1 bg-red-500 text-white w-5 h-5 rounded-full border-[1.5px] border-white flex items-center justify-center text-[10px] shadow-sm"><i class="fa-solid fa-flag"></i></div>' : ''}
          </div>
        `;
        return L.divIcon({
          html: htmlStr,
          className: 'custom-div-icon',
          iconSize: [40, 40],
          iconAnchor: [20, 40],
          popupAnchor: [0, -32]
        });
      };

      properties.filter(p => !p.isDeleted).forEach(p => {
        const m = L.marker([p.lat, p.lng], { icon: getCustomIcon(p.type, p.flagged) });
        
        const routeUrl = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;
        const popupContent = `
          <div class="mb-2">
            <h4 class="font-bold text-slate-800 text-[13px] leading-tight mb-1">${esc(p.name)}</h4>
            <div class="text-[11px] text-slate-500">${esc(p.type)}</div>
          </div>
          <div class="flex space-x-1 mt-2">
            <button onclick="window.moveToTrash('${p.id}')" class="flex-1 py-2 bg-red-500 text-white font-bold rounded-lg text-[11px] hover:bg-red-600 transition-colors shadow-sm whitespace-nowrap">
              <i class="fa-solid fa-trash mr-1"></i>削除
            </button>
            <button onclick="window.openFormModal('${p.id}')" class="flex-1 py-2 bg-zinc-100 text-slate-600 font-bold rounded-lg text-[11px] hover:bg-zinc-200 transition-colors shadow-sm whitespace-nowrap">
              編集
            </button>
            <a href="${routeUrl}" target="_blank" class="flex-1 py-2 bg-blue-500 font-bold rounded-lg text-[11px] hover:bg-blue-600 transition-colors shadow-sm flex justify-center items-center whitespace-nowrap" style="color: white !important; text-decoration: none;">
              <i class="fa-solid fa-route mr-1"></i>ルート
            </a>
          </div>
        `;
        
        m.bindPopup(popupContent);
        savedMarkersLayer.addLayer(m);
      });

        btn.classList.add('text-slate-400');

    window.saveProperty = function() {
      const id = document.getElementById('form-id').value;
      let name = document.getElementById('form-name').value.trim();
      const type = document.getElementById('form-type').value;
      const address = document.getElementById('form-address').value.trim();
      const memo = document.getElementById('form-memo').value.trim();

      const now = new Date();
      const dateStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

      // 物件名が空の場合は、現在の日時を自動設定する
      if (!name) {
        name = dateStr;
      }

      if (id) {
        const idx = properties.findIndex(p => p.id === id);
        if (idx !== -1) {
          properties[idx] = { 
            ...properties[idx], 
            name, type, address, memo,
            updatedAt: dateStr,
            timestamp: Date.now() 
          };
        }
      } else {
        properties.push({
          id: Date.now().toString(),
          lat: currentLocation.lat, lng: currentLocation.lng,
          name, type, address, memo,
          createdAt: dateStr,
          timestamp: Date.now(),
          flagged: false,
          isDeleted: false
        });
      }

      saveToLocal();
      renderList();
      renderMapMarkers();
      closeFormModal();
      
      const btn = document.getElementById('save-submit-btn');
      if (btn) {
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-check mr-2"></i>保存しました！';
        setTimeout(() => { btn.innerHTML = originalText; }, 2000);
      }
    };

    window.moveToTrash = function(id) {
      const idx = properties.findIndex(p => p.id === id);
      if (idx !== -1) {
        properties[idx].isDeleted = true;
        saveToLocal();
        renderList();
        renderTrash();
        renderMapMarkers();
        if(map) map.closePopup();
      }
    };

    window.restoreProperty = function(id) {
      const idx = properties.findIndex(p => p.id === id);
      if (idx !== -1) {
        properties[idx].isDeleted = false;
        saveToLocal();
        renderList();
        renderTrash();
        renderMapMarkers();
      }
    };

    window.permanentlyDeleteProperty = function(id) {
      customConfirm('この物件データを完全に削除しますか？\n（復元できません）', () => {
        properties = properties.filter(p => p.id !== id);
        saveToLocal();
        renderTrash();
      });
    };

    window.emptyTrash = function() {
      const trashCount = properties.filter(p => p.isDeleted).length;
      if (trashCount === 0) return;
      
      customConfirm(`ゴミ箱の中の ${trashCount} 件をすべて完全に削除しますか？\n（復元できません）`, () => {
        properties = properties.filter(p => !p.isDeleted);
        saveToLocal();
        renderTrash();
      });
    };

    function saveToLocal() {
      localStorage.setItem('storeProperties', JSON.stringify(properties));
    }

    function renderList() {
      const listEl = document.getElementById('property-list');
      const activeProperties = properties.filter(p => !p.isDeleted);
      document.getElementById('list-count').textContent = `${activeProperties.length}件`;
      listEl.innerHTML = '';

      if (activeProperties.length === 0) {
        listEl.innerHTML = '<div class="text-center py-10 text-slate-400 text-sm"><i class="fa-solid fa-map-location-dot text-4xl mb-3 opacity-50 block"></i>登録された物件はありません</div>';
        return;
      }

      const sorted = [...activeProperties].sort((a, b) => {
        const timeA = a.timestamp || Number(a.id);
        const timeB = b.timestamp || Number(b.id);
        return timeB - timeA;
      });

      sorted.forEach(p => {
        listEl.appendChild(createCardHTML(p, false));
      });
    }

    function renderTrash() {
      const listEl = document.getElementById('trash-list');
      const deletedProperties = properties.filter(p => p.isDeleted);
      listEl.innerHTML = '';

      if (deletedProperties.length === 0) {
        listEl.innerHTML = '<div class="text-center py-10 text-slate-400 text-sm"><i class="fa-solid fa-trash-can text-4xl mb-3 opacity-30 block"></i>ゴミ箱は空です</div>';
        return;
      }

      const sorted = [...deletedProperties].sort((a, b) => b.timestamp - a.timestamp);
      
      sorted.forEach(p => {
        listEl.appendChild(createCardHTML(p, true));
      });
    }

    function initSwipeLogic() {
      let touchStartX = 0;
      let touchStartY = 0;
      let currentSwipeContent = null;
      let currentTranslateX = 0;
      let isScrolling = false;

      function handleDragStart(e) {
        // [修正部分] ゴミ箱（削除）ボタンへのタップを検知した場合は、カードを閉じる処理をスキップする
        if (e.target.closest('button[onclick^="window.moveToTrash"]')) {
          return;
        }

        const swipeEl = e.target.closest('.swipe-content');
        
        // タップしたカード以外の「開いているカード」を閉じる
        document.querySelectorAll('.swipe-content').forEach(el => {
          if (el !== swipeEl && el.dataset.open === 'true') {
            el.style.transform = 'translateX(0)';
            el.dataset.open = 'false';
          }
        });

        if (!swipeEl) return;
        if (e.type === 'mousedown' && e.target.closest('button, a, input, label')) return;

        touchStartX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
        touchStartY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
        currentSwipeContent = swipeEl;
        isScrolling = false;
        
        currentSwipeContent.style.transition = 'none';
        const match = currentSwipeContent.style.transform.match(/translateX\(([-\d.]+)px\)/);
        currentTranslateX = match ? parseFloat(match[1]) : 0;
      }

      function handleDragMove(e) {
        if (!currentSwipeContent) return;
        
        const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
        const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
        const deltaX = clientX - touchStartX;
        const deltaY = clientY - touchStartY;

        if (!isScrolling) {
          if (Math.abs(deltaY) > Math.abs(deltaX) && Math.abs(deltaY) > 5) {
            isScrolling = true;
          }
        }
        if (isScrolling) {
          currentSwipeContent = null;
          return;
        }

        let newX = currentTranslateX + deltaX;
        if (newX > 0) newX = 0; 
        if (newX < -80) newX = -80 - (Math.abs(newX + 80) * 0.2); 

        currentSwipeContent.style.transform = `translateX(${newX}px)`;
      }

      function handleDragEnd() {
        if (!currentSwipeContent) return;
        currentSwipeContent.style.transition = 'transform 0.2s ease-out';
        const match = currentSwipeContent.style.transform.match(/translateX\(([-\d.]+)px\)/);
        const currentX = match ? parseFloat(match[1]) : 0;

        if (currentX < -40) {
          currentSwipeContent.style.transform = 'translateX(-80px)';
          currentSwipeContent.dataset.open = 'true';
        } else {
          currentSwipeContent.style.transform = 'translateX(0)';
          currentSwipeContent.dataset.open = 'false';
        }
        currentSwipeContent = null;
      }

      document.addEventListener('touchstart', handleDragStart, { passive: true });
      document.addEventListener('touchmove', handleDragMove, { passive: true });
      document.addEventListener('touchend', handleDragEnd);

      document.addEventListener('mousedown', handleDragStart);
      document.addEventListener('mousemove', e => {
        if (currentSwipeContent && e.buttons !== 1) { 
          handleDragEnd();
          return;
        }
        handleDragMove(e);
      });
      document.addEventListener('mouseup', handleDragEnd);
    }

    window.moveToProperty = function(lat, lng) {
      window.switchTab('map');
      map.setView([lat, lng], 17);
    };

    window.exportData = function(type) {
      const activeProperties = properties.filter(p => !p.isDeleted);
      if (activeProperties.length === 0) {
        customAlert('出力するデータがありません。\n（ゴミ箱内のデータは出力されません）');
        return;
      }
      let content, mimeType, filename;
      const dateStr = new Date().toISOString().slice(0,10).replace(/-/g,'');

      if (type === 'json') {
        content = JSON.stringify(activeProperties, null, 2);
        mimeType = 'application/json';
        filename = `BukkenMemo_${dateStr}.json`;
      } else if (type === 'csv') {
        const headers = ['ID', '登録日時', '更新日時', '物件名', '物件種別', '住所', '緯度', '経度', 'メモ', 'フラッグ'];
        const rows = activeProperties.map(p => [
          `"${p.id}"`, `"${p.createdAt}"`, `"${p.updatedAt || ''}"`, `"${(p.name || '').replace(/"/g, '""')}"`, 
          `"${p.type}"`, `"${(p.address || '').replace(/"/g, '""')}"`, `"${p.lat}"`, `"${p.lng}"`,
          `"${(p.memo || '').replace(/"/g, '""')}"`, `"${p.flagged ? 'TRUE' : 'FALSE'}"`
        ]);
        content = "\uFEFF" + [headers.map(h => `"${h}"`), ...rows].map(e => e.join(",")).join("\n");
        mimeType = 'text/csv;charset=utf-8;';
        filename = `BukkenMemo_${dateStr}.csv`;
      }

      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    };

    window.importData = function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (!Array.isArray(data)) throw new Error("Invalid format");
          
          let importedCount = 0;
          data.forEach(item => {
            if (item.id && typeof item.lat === 'number' && typeof item.lng === 'number' && item.name) {
              if (!properties.find(p => p.id === item.id)) {
                item.isDeleted = false;
                properties.push(item);
                importedCount++;
              }
            }
          });

          if(importedCount > 0) {
            saveToLocal();
            renderList();
            renderMapMarkers();
            customAlert(`${importedCount}件のデータをインポートしました！`);
          } else {
            customAlert('新しいデータはありませんでした。\n（重複、または名前等の必須項目が欠損しているデータ）');
          }
        } catch (err) {
          customAlert("ファイルの読み込みに失敗しました。\n正しいJSONファイルを選択してください。");
        }
        event.target.value = ''; 
      };
      reader.readAsText(file);
    };

    window.toggleFlag = function(id) {
      const idx = properties.findIndex(p => p.id === id);
      if (idx !== -1) {
        properties[idx].flagged = !properties[idx].flagged;
        saveToLocal();
        renderList();
        renderMapMarkers();
      }
    };

    window.searchAddress = async function() {
      const input = document.getElementById('map-search-input');
      const btn = document.getElementById('map-search-btn');
      const query = input.value.trim();
      if (!query) return;

      const originalIcon = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
      input.disabled = true;

      try {
        const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(query)}&limit=1&accept-language=ja`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('Search failed');
        const data = await res.json();

        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lng = parseFloat(data[0].lon);
          map.setView([lat, lng], 16);
          marker.setLatLng([lat, lng]);
          updateCurrentLocation(lat, lng);
          input.blur(); 
        } else {
          customAlert('「' + query + '」が見つかりませんでした。\n市町村名などを加えて再度お試しください。');
        }
      } catch (error) {
        customAlert('検索エラーが発生しました。\nネットワーク環境をご確認ください。');
      } finally {
        btn.innerHTML = originalIcon;
        input.disabled = false;
      }
    };
  </script>
</body>
</html>
