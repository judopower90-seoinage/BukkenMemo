<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BukkenMemo">
  
  <title>BukkenMemo</title>
  
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/854/854878.png">
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/854/854878.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      overscroll-behavior-y: none;
      background-color: #f3f4f6;
    }
    .env-safe-top { padding-top: var(--safe-top); }
    .pb-safe { padding-bottom: calc(var(--safe-bottom) + 64px); }
    
    #map { 
      width: 100%;
      height: 100%;
      z-index: 10; 
    }
    
    /* Leaflet Overrides */
    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      padding: 0;
      overflow: hidden;
    }
    .leaflet-popup-content {
      margin: 0;
      min-width: 280px;
    }
    .leaflet-container a.leaflet-popup-close-button {
      color: #6b7280;
      padding: 8px;
    }
    .custom-div-icon {
      background: transparent;
      border: none;
    }
    
    /* Target Marker (新規登録用のターゲット) */
    .target-marker {
      width: 24px;
      height: 24px;
      background-color: #1d4ed8;
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      position: relative;
    }
    .target-marker::after {
      content: '';
      position: absolute;
      top: -10px; left: -10px; right: -10px; bottom: -10px;
      border-radius: 50%;
      background: rgba(29, 78, 216, 0.2);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.5); opacity: 1; }
      100% { transform: scale(2); opacity: 0; }
    }

    /* Swipe Content Transition */
    .swipe-content {
      will-change: transform;
      touch-action: pan-y;
    }
  </style>
</head>
<body class="h-screen w-full flex flex-col overflow-hidden">

  <header class="bg-blue-800 text-white shadow-md z-20 relative env-safe-top shrink-0">
    <div class="flex justify-between items-center px-4 py-3">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-map-location-dot text-xl"></i>
        <h1 class="text-lg font-bold tracking-wider">BukkenMemo</h1>
      </div>
      <div class="flex space-x-2">
        <button onclick="window.showTrashModal()" class="w-9 h-9 rounded-full bg-blue-700 hover:bg-blue-600 flex items-center justify-center transition-colors">
          <i class="fa-solid fa-trash-can text-sm"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Settings Menu -->
  <div id="settings-menu" class="absolute right-4 bg-white rounded-xl shadow-[0_0_20px_rgba(0,0,0,0.2)] py-2 z-50 hidden border border-gray-100 w-56 origin-bottom-right transition-all" style="bottom: calc(env(safe-area-inset-bottom, 0px) + 76px);">
    <button onclick="window.exportData('json')" class="w-full text-left px-5 py-3 text-sm text-gray-700 hover:bg-gray-50 flex items-center">
      <i class="fa-solid fa-file-code w-6 text-gray-400"></i>JSONでバックアップ
    </button>
    <button onclick="window.exportData('csv')" class="w-full text-left px-5 py-3 text-sm text-gray-700 hover:bg-gray-50 flex items-center">
      <i class="fa-solid fa-file-csv w-6 text-gray-400"></i>CSVでバックアップ
    </button>
    <label class="w-full text-left px-5 py-3 text-sm text-gray-700 hover:bg-gray-50 flex items-center cursor-pointer border-t border-gray-100">
      <i class="fa-solid fa-folder-open w-6 text-gray-400"></i>データを復元 (JSON)
      <input type="file" accept=".json" class="hidden" onchange="window.importData(event)">
    </label>
  </div>

  <main class="flex-1 relative overflow-hidden flex flex-col bg-gray-50">
    
    <div id="view-map" class="absolute inset-0 flex flex-col z-10 transition-opacity duration-300">
      
      <!-- Search Bar & Layer Toggle -->
      <div class="absolute top-4 left-4 right-4 flex space-x-2 z-[1000] pointer-events-auto">
        <div class="flex-1 flex bg-white rounded-xl shadow-lg overflow-hidden border border-gray-100 items-center pl-3">
          <i class="fa-solid fa-magnifying-glass text-gray-400"></i>
          <input type="text" id="map-search-input" placeholder="住所や施設名を検索" class="flex-1 px-3 py-3 text-sm text-gray-700 outline-none" onkeypress="if(event.key==='Enter') window.searchAddress()">
          <button onclick="window.searchAddress()" class="px-4 py-3 bg-gray-50 text-blue-600 hover:bg-blue-50 border-l border-gray-100 font-bold transition-colors">
            検索
          </button>
        </div>
        <button onclick="window.toggleLayerMenu()" class="w-12 h-12 bg-white rounded-xl shadow-lg flex items-center justify-center text-gray-600 hover:text-blue-600 transition-colors border border-gray-100 shrink-0">
          <i class="fa-solid fa-layer-group text-lg"></i>
        </button>
      </div>

      <!-- Layer Menu -->
      <div id="layer-menu" class="absolute top-18 right-4 bg-white rounded-xl shadow-xl py-2 z-[1001] hidden border border-gray-100 w-48 pointer-events-auto">
        <div class="px-4 py-2 text-xs font-bold text-gray-400 border-b border-gray-50">地図の種類</div>
        <button onclick="window.switchLayer('gsi')" class="w-full text-left px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 flex items-center justify-between">
          <span>国土地理院 (標準)</span><i class="fa-solid fa-check text-blue-600 hidden layer-check-gsi"></i>
        </button>
        <button onclick="window.switchLayer('google')" class="w-full text-left px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 flex items-center justify-between">
          <span>Google マップ</span><i class="fa-solid fa-check text-blue-600 hidden layer-check-google"></i>
        </button>
        <button onclick="window.switchLayer('googleSat')" class="w-full text-left px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 flex items-center justify-between">
          <span>航空写真</span><i class="fa-solid fa-check text-blue-600 hidden layer-check-googleSat"></i>
        </button>
      </div>

      <div id="map" class="flex-1 w-full"></div>

      <!-- Locate Me -->
      <button onclick="window.locateMe()" class="absolute bottom-[160px] right-4 z-[1000] w-12 h-12 bg-white rounded-full shadow-lg flex items-center justify-center text-blue-600 border border-gray-100 hover:bg-blue-50 transition-colors pointer-events-auto">
        <i class="fa-solid fa-location-crosshairs text-xl"></i>
      </button>

      <!-- Bottom Panel (Address & Register) -->
      <div class="absolute bottom-0 left-0 w-full bg-white rounded-t-3xl shadow-[0_-10px_30px_rgba(0,0,0,0.1)] p-5 z-[1000] pointer-events-auto pb-safe">
        <div class="flex items-start mb-4">
          <i class="fa-solid fa-location-dot text-blue-600 mt-1 mr-3 text-lg"></i>
          <div class="flex-1 min-w-0">
            <p class="text-xs text-gray-500 font-bold mb-1">新規登録ピンの位置</p>
            <p id="current-address" class="text-gray-800 font-bold text-sm leading-snug line-clamp-2">現在地を取得中...</p>
          </div>
        </div>
        <button onclick="window.openFormModal()" class="w-full bg-blue-800 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-md transition-colors flex justify-center items-center">
          <i class="fa-solid fa-pen-to-square mr-2"></i>登録
        </button>
      </div>
    </div>

    <div id="view-list" class="absolute inset-0 bg-gray-50 z-0 opacity-0 pointer-events-none transition-opacity duration-300 overflow-y-auto pb-safe">
      <div class="sticky top-0 bg-white border-b border-gray-200 px-4 py-3 flex justify-between items-center z-20 shadow-sm">
        <h2 class="font-bold text-gray-700 flex items-center"><i class="fa-solid fa-list-ul mr-2 text-blue-600"></i>登録物件リスト</h2>
        <span id="list-count" class="bg-gray-100 text-gray-600 px-3 py-1 rounded-full text-xs font-bold">0件</span>
      </div>
      <div id="property-list" class="p-0">
        <!-- List items injected here -->
      </div>
    </div>
  </main>

  <nav class="bg-white border-t border-gray-200 z-30 shrink-0 pb-[env(safe-area-inset-bottom,0px)] relative">
    <div class="flex justify-around items-center h-16">
      <button onclick="window.switchMainView('map')" id="nav-map" class="flex-1 flex flex-col items-center justify-center text-blue-600 transition-colors">
        <i class="fa-solid fa-map mb-1 text-xl"></i>
        <span class="text-[10px] font-bold">マップ</span>
      </button>
      <button onclick="window.switchMainView('list')" id="nav-list" class="flex-1 flex flex-col items-center justify-center text-gray-400 hover:text-blue-500 transition-colors">
        <i class="fa-solid fa-list mb-1 text-xl"></i>
        <span class="text-[10px] font-bold">リスト</span>
      </button>
      <button onclick="window.toggleSettingsMenu()" id="nav-settings" class="flex-1 flex flex-col items-center justify-center text-gray-400 hover:text-blue-500 transition-colors relative">
        <i class="fa-solid fa-database mb-1 text-xl"></i>
        <span class="text-[10px] font-bold">データ管理</span>
      </button>
    </div>
  </nav>

  <!-- Detail Modal -->
  <div id="detail-modal" class="fixed inset-0 bg-black/60 z-50 hidden opacity-0 transition-opacity duration-300 flex items-end sm:items-center justify-center">
    <div class="bg-white w-full sm:w-[500px] max-h-[85vh] rounded-t-3xl sm:rounded-2xl flex flex-col shadow-2xl transform translate-y-full sm:translate-y-0 transition-transform duration-300" id="detail-content">
      <div class="flex justify-between items-center p-4 border-b border-gray-100">
        <span id="detail-type-badge" class="px-3 py-1 rounded-full text-xs font-bold text-white bg-blue-600">種別</span>
        <button onclick="window.closeDetailModal()" class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-500 hover:bg-gray-200 transition-colors">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="p-5 overflow-y-auto flex-1 space-y-4">
        <div>
          <div class="flex items-start justify-between">
            <h3 class="text-xl font-bold text-gray-900 leading-snug break-words" id="detail-name">物件名</h3>
            <span id="detail-flag-badge" class="ml-2 hidden text-red-500 text-sm py-1 shrink-0"><i class="fa-solid fa-flag mr-1"></i>注目</span>
          </div>
          <div class="text-xs text-gray-400 mt-1 flex flex-wrap gap-x-3" id="detail-dates"></div>
        </div>

        <div class="bg-gray-50 p-3.5 rounded-xl border border-gray-100">
          <p class="text-xs font-bold text-gray-400 mb-1 flex items-center"><i class="fa-solid fa-location-dot mr-1.5 text-blue-600"></i>住所</p>
          <p id="detail-address" class="text-sm text-gray-800 break-words leading-relaxed"></p>
        </div>

        <div class="bg-gray-50 p-3.5 rounded-xl border border-gray-100">
          <p class="text-xs font-bold text-gray-400 mb-1 flex items-center"><i class="fa-solid fa-comment-dots mr-1.5 text-blue-600"></i>メモ</p>
          <p id="detail-memo" class="text-sm text-gray-800 break-words whitespace-pre-wrap leading-relaxed min-h-[40px]"></p>
        </div>
      </div>

      <div class="p-4 border-t border-gray-100 bg-white flex flex-col space-y-2 pb-[calc(env(safe-area-inset-bottom,0px)+16px)]">
        <a id="detail-route-btn" href="#" target="_blank" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition-colors flex justify-center items-center text-sm" style="text-decoration:none; color:#ffffff !important;">
          <i class="fa-solid fa-route mr-2" style="color:#ffffff !important;"></i>Google マップでルート案内
        </a>
        <div class="flex space-x-2">
          <button id="detail-map-btn" class="flex-1 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl text-xs transition-colors flex justify-center items-center">
            <i class="fa-solid fa-map-location-dot mr-1.5 text-blue-600"></i>地図で表示
          </button>
          <button id="detail-edit-btn" class="flex-1 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl text-xs transition-colors flex justify-center items-center">
            <i class="fa-solid fa-pen mr-1.5 text-gray-600"></i>編集
          </button>
          <button id="detail-delete-btn" class="w-11 py-2.5 bg-red-50 hover:bg-red-100 text-red-600 font-bold rounded-xl text-xs transition-colors flex justify-center items-center shrink-0">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Registration/Edit Modal -->
  <div id="form-modal" class="fixed inset-0 bg-black/60 z-50 hidden opacity-0 transition-opacity duration-300 flex items-end sm:items-center justify-center">
    <div class="bg-white w-full sm:w-[500px] h-[90vh] sm:h-auto sm:max-h-[90vh] rounded-t-3xl sm:rounded-2xl flex flex-col shadow-2xl transform translate-y-full sm:translate-y-0 transition-transform duration-300" id="form-content">
      <div class="flex justify-between items-center p-4 border-b border-gray-100">
        <h3 class="text-lg font-bold text-gray-800" id="modal-title">地点情報</h3>
        <button onclick="window.closeFormModal()" class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-500 hover:bg-gray-200 transition-colors">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      
      <div class="p-5 overflow-y-auto flex-1 space-y-5">
        <input type="hidden" id="form-id">
        <input type="hidden" id="form-lat">
        <input type="hidden" id="form-lng">
        
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1.5">物件名 / 施設名</label>
          <input type="text" id="form-name" placeholder="未入力の場合は自動で日時が登録されます" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800 transition-all">
        </div>
        
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1.5">種別</label>
          <div class="relative">
            <select id="form-type" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800 appearance-none cursor-pointer">
              <option value="ロードサイド物件">🚗 ロードサイド物件</option>
              <option value="ビルイン物件">🏢 ビルイン物件</option>
              <option value="クライアント所在地">💼 クライアント所在地</option>
              <option value="地権者">🏠 地権者</option>
              <option value="未分類">❓ 未分類</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
              <i class="fa-solid fa-chevron-down text-xs"></i>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1.5">住所</label>
          <textarea id="form-address" rows="2" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800"></textarea>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1.5">メモ</label>
          <textarea id="form-memo" rows="3" placeholder="営業時間や備考などを入力..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800"></textarea>
        </div>
      </div>
      <div class="p-4 border-t border-gray-100 bg-white pb-[env(safe-area-inset-bottom,16px)]">
        <button id="save-submit-btn" onclick="window.saveProperty()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition-colors flex justify-center items-center">
          保存する
        </button>
      </div>
    </div>
  </div>

  <!-- Trash Modal -->
  <div id="trash-modal" class="fixed inset-0 bg-black/60 z-[80] hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md h-[80vh] rounded-2xl flex flex-col shadow-2xl transform scale-95 transition-transform duration-300" id="trash-content">
      <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50 rounded-t-2xl">
        <h3 class="font-bold text-gray-800 flex items-center"><i class="fa-solid fa-trash-can mr-2 text-gray-500"></i>ゴミ箱</h3>
        <button onclick="window.hideTrashModal()" class="text-gray-400 hover:text-gray-600 w-8 h-8 flex items-center justify-center"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <div class="p-3 flex justify-between items-center border-b border-gray-100 bg-white">
        <span class="text-xs text-gray-500 pl-2">削除済みアイテム</span>
        <button onclick="window.emptyTrash()" class="text-xs font-bold bg-red-50 text-red-600 px-3 py-1.5 rounded-lg hover:bg-red-100 transition-colors border border-red-100">全て完全削除</button>
      </div>
      <div class="flex-1 overflow-y-auto p-4 bg-gray-50" id="trash-list">
        <!-- Trash items injected here -->
      </div>
    </div>
  </div>

  <!-- Custom Dialog -->
  <div id="dialog-modal" class="fixed inset-0 bg-black/60 z-[9999] hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl transform scale-95 transition-transform duration-300 text-center" id="dialog-content">
      <p id="dialog-message" class="text-gray-800 text-sm font-bold mb-6 whitespace-pre-wrap leading-relaxed"></p>
      <div class="flex space-x-3 justify-center">
        <button id="dialog-cancel" class="flex-1 py-3 bg-gray-100 text-gray-600 text-sm font-bold rounded-xl hover:bg-gray-200 transition-colors hidden">キャンセル</button>
        <button id="dialog-ok" class="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold rounded-xl shadow-md transition-colors">OK</button>
      </div>
    </div>
  </div>

  <script>
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    // Custom Dialog Logic (Replaces alert/confirm)
    let dialogConfirmCallback = null;
    function showDialog(message, isConfirm, callback = null) {
      const modal = document.getElementById('dialog-modal');
      const content = document.getElementById('dialog-content');
      document.getElementById('dialog-message').textContent = message;
      
      const cancelBtn = document.getElementById('dialog-cancel');
      if (isConfirm) {
        cancelBtn.classList.remove('hidden');
      } else {
        cancelBtn.classList.add('hidden');
      }
      dialogConfirmCallback = callback;
      
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        content.classList.remove('scale-95');
        content.classList.add('scale-100');
      }, 10);
    }
    function closeDialog() {
      const modal = document.getElementById('dialog-modal');
      const content = document.getElementById('dialog-content');
      modal.classList.add('opacity-0');
      content.classList.remove('scale-100');
      content.classList.add('scale-95');
      setTimeout(() => { modal.classList.add('hidden'); }, 300);
    }
    document.getElementById('dialog-cancel').addEventListener('click', closeDialog);
    document.getElementById('dialog-ok').addEventListener('click', () => {
      closeDialog();
      if (dialogConfirmCallback) dialogConfirmCallback();
    });
    function customAlert(message) { showDialog(message, false); }
    function customConfirm(message, onConfirmCallback) { showDialog(message, true, onConfirmCallback); }

    // State
    let map, targetMarker;
    let savedMarkersLayer; 
    let currentLocation = { lat: 35.681236, lng: 139.767125, address: '現在地を取得中...' };
    
    // Load Data
    let properties = JSON.parse(localStorage.getItem('BukkenMemo_properties') || '[]');
    
    let currentMainView = 'map';
    let geocodeSeq = 0;
    let geoTimer = null;
    
    let mapLayers = {};
    let currentLayer = 'gsi';

    const typeColors = {
      'ロードサイド物件': '#3b82f6', // blue
      'ビルイン物件': '#10b981', // green
      'クライアント所在地': '#8b5cf6', // purple
      '地権者': '#f59e0b', // amber
      '未分類': '#6b7280' // gray
    };

    // --- Initialization ---
    function initApp() {
      initMap();
      renderMapMarkers();
      renderList();
      updateLayerChecks();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
    
    // Fallback for iframe previews
    setTimeout(() => { if(!map) initApp(); }, 1000);

    // --- Map Logic ---
    function initMap() {
      if(map) return;
      map = L.map('map', { zoomControl: false, attributionControl: false }).setView([currentLocation.lat, currentLocation.lng], 15);
      
      // Define Layers
      mapLayers = {
        gsi: L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
          maxZoom: 18,
          attribution: "<a href='https://maps.gsi.go.jp/development/ichiran.html' target='_blank'>地理院タイル</a>"
        }),
        google: L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20 }),
        googleSat: L.tileLayer('https://mt1.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', { maxZoom: 20 })
      };
      
      mapLayers[currentLayer].addTo(map);
      savedMarkersLayer = L.layerGroup().addTo(map);

      // Target Marker (Center crosshairs equivalent)
      const targetIcon = L.divIcon({
        html: `<div class="target-marker"></div>`,
        className: 'custom-div-icon',
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      });

      targetMarker = L.marker([currentLocation.lat, currentLocation.lng], {
        icon: targetIcon,
        draggable: true,
        zIndexOffset: 1000 
      }).addTo(map);

      targetMarker.on('dragend', function (e) {
        const pos = targetMarker.getLatLng();
        updateCurrentLocation(pos.lat, pos.lng);
      });

      map.on('click', function (e) {
        targetMarker.setLatLng(e.latlng);
        updateCurrentLocation(e.latlng.lat, e.latlng.lng);
      });

      // Initial locate attempt
      if (navigator.geolocation && window.location.protocol === 'https:') {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            map.setView([lat, lng], 17);
            targetMarker.setLatLng([lat, lng]);
            updateCurrentLocation(lat, lng);
          },
          (error) => { console.warn("Auto-locate failed", error); },
          { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
        );
      }
    }

    function updateCurrentLocation(lat, lng) {
      currentLocation.lat = lat;
      currentLocation.lng = lng;
      
      const addrEl = document.getElementById('current-address');
      if(addrEl) addrEl.textContent = '現在地を取得中...';
      
      clearTimeout(geoTimer);
      geoTimer = setTimeout(() => reverseGeocode(lat, lng), 600);
    }

    async function reverseGeocode(lat, lng) {
      const mySeq = ++geocodeSeq;
      try {
        const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=ja`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('Network error');
        const data = await res.json();
        if (mySeq !== geocodeSeq) return; 

        let addr = '';
        if (data.address) {
          const a = data.address;
          addr += (a.province || a.prefecture || '') + (a.city || a.town || a.village || a.county || '');
          addr += (a.suburb || a.quarter || '') + (a.neighbourhood || '');
          if (a.road) addr += ' ' + a.road;
          if (a.house_number) addr += ' ' + a.house_number;
        }
        currentLocation.address = addr.trim() || `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      } catch (error) {
        if (mySeq !== geocodeSeq) return;
        currentLocation.address = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      }
      
      const addrEl = document.getElementById('current-address');
      if(addrEl) addrEl.textContent = currentLocation.address;
    }

    window.locateMe = function() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            map.flyTo([lat, lng], 17, {duration: 0.5});
            targetMarker.setLatLng([lat, lng]);
            updateCurrentLocation(lat, lng);
          },
          (error) => { /* Silent fail in previews */ },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      }
    };

    window.searchAddress = async function() {
      const input = document.getElementById('map-search-input');
      const query = input.value.trim();
      if (!query) return;

      try {
        const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(query)}&limit=1&accept-language=ja`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('Search failed');
        const data = await res.json();

        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lng = parseFloat(data[0].lon);
          map.flyTo([lat, lng], 16, {duration: 0.5});
          targetMarker.setLatLng([lat, lng]);
          updateCurrentLocation(lat, lng);
          input.blur(); 
        } else {
          customAlert('見つかりませんでした。\n条件を変更してお試しください。');
        }
      } catch (error) {
        customAlert('検索中にエラーが発生しました。');

    function initSwipeLogic() {
      let touchStartX = 0;
      let currentSwipeContent = null;
      let currentTranslateX = 0;
      const threshold = -40;
      const maxSwipe = -96; // matches w-24

      function handleDragStart(e) {
        if (e.target.closest('button, a')) return;
        
        isCardSwiping = false;
        const swipeEl = e.target.closest('.swipe-content');
        
        document.querySelectorAll('.swipe-content').forEach(el => {
          if (el !== swipeEl && el.dataset.open === 'true') {
            el.style.transform = 'translateX(0)';
            el.dataset.open = 'false';
          }
        });

        if (!swipeEl) return;
        
        touchStartX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
        currentSwipeContent = swipeEl;
        
        currentSwipeContent.style.transition = 'none';
        const match = currentSwipeContent.style.transform.match(/translateX\(([-\d.]+)px\)/);
        currentTranslateX = match ? parseFloat(match[1]) : 0;
      }

      function handleDragMove(e) {
        if (!currentSwipeContent) return;
        
        const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
        const deltaX = clientX - touchStartX;

        if (Math.abs(deltaX) > 10) {
          isCardSwiping = true;
        }

        if(Math.abs(deltaX) < 10 && e.type === 'touchmove') return;

        let newX = currentTranslateX + deltaX;
        if (newX > 0) newX = 0; 
        if (newX < maxSwipe) newX = maxSwipe - (Math.abs(newX - maxSwipe) * 0.2); 

        currentSwipeContent.style.transform = `translateX(${newX}px)`;
        e.preventDefault(); 
      }

      function handleDragEnd() {
        if (!currentSwipeContent) return;
        currentSwipeContent.style.transition = 'transform 0.2s ease-out';
        const match = currentSwipeContent.style.transform.match(/translateX\(([-\d.]+)px\)/);
        const currentX = match ? parseFloat(match[1]) : 0;

        if (currentX < threshold) {
          currentSwipeContent.style.transform = `translateX(${maxSwipe}px)`;
          currentSwipeContent.dataset.open = 'true';
        } else {
          currentSwipeContent.style.transform = 'translateX(0)';
          currentSwipeContent.dataset.open = 'false';
        }
        
        setTimeout(() => {
          currentSwipeContent = null;
          isCardSwiping = false;
        }, 100);
      }

      const listContainer = document.getElementById('view-list');
      if(listContainer._swipeInitialized) return; 
      
      listContainer.addEventListener('touchstart', handleDragStart, { passive: true });
      listContainer.addEventListener('touchmove', handleDragMove, { passive: false });
      listContainer.addEventListener('touchend', handleDragEnd);
      listContainer._swipeInitialized = true;
    }

      deletedProps.sort((a, b) => b.timestamp - a.timestamp).forEach(p => {
        const div = document.createElement('div');
        div.className = 'bg-white p-4 rounded-xl mb-3 flex justify-between items-center shadow-sm border border-gray-100';
        div.innerHTML = `
          <div class="flex-1 min-w-0 pr-4">
             <h4 class="font-bold text-gray-500 text-sm truncate line-through mb-1">${esc(p.name)}</h4>
             <p class="text-[10px] text-gray-400 truncate">${esc(p.address)}</p>
          </div>
          <div class="flex space-x-2 flex-shrink-0">
             <button onclick="window.restoreProperty('${p.id}')" class="w-10 h-10 bg-blue-50 text-blue-600 rounded-xl shadow-sm flex items-center justify-center hover:bg-blue-100 transition-colors" title="復元"><i class="fa-solid fa-arrow-rotate-left"></i></button>
             <button onclick="window.permanentlyDeleteProperty('${p.id}')" class="w-10 h-10 bg-red-50 text-red-500 rounded-xl shadow-sm flex items-center justify-center hover:bg-red-100 transition-colors" title="完全削除"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;
        listEl.appendChild(div);
      });
    }

    window.restoreProperty = function(id) {
      const idx = properties.findIndex(p => p.id === id);
      if (idx !== -1) {
        properties[idx].isDeleted = false;
        saveToLocal();
        renderTrashList();
        renderList();
        renderMapMarkers();
      }
    };

    window.permanentlyDeleteProperty = function(id) {
      customConfirm('完全に削除しますか？復元できません。', () => {
        properties = properties.filter(p => p.id !== id);
        saveToLocal();
        renderTrashList();
      });
    };

    window.emptyTrash = function() {
      if(properties.filter(p => !p.isDeleted).length === 0) return;
      customConfirm('ゴミ箱の中身をすべて完全に削除しますか？', () => {
        properties = properties.filter(p => !p.isDeleted);
        saveToLocal();
        renderTrashList();
      });
    };

    window.exportData = function(exportType) {
      document.getElementById('settings-menu').classList.add('hidden');
      const activeProps = properties.filter(p => !p.isDeleted);
      if (activeProps.length === 0) return customAlert('出力するデータがありません。');
      
      let content, mimeType, filename;
      
      // 端末の現在日時（ローカル時間）から年月日を取得
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const dateStr = `${yyyy}${mm}${dd}`;

      if (exportType === 'json') {
        content = JSON.stringify(activeProps, null, 2);
        mimeType = 'application/json';
        filename = `BukkenMemo_${dateStr}.json`;
      } else if (exportType === 'csv') {
        const headers = ['ID', '作成日時', '更新日時', '物件名', '種別', '住所', '緯度', '経度', 'メモ', 'フラッグ'];
        const rows = activeProps.map(p => [
          `"${p.id}"`, `"${p.createdAt}"`, `"${p.updatedAt || ''}"`, `"${(p.name || '').replace(/"/g, '""')}"`, 
          `"${p.type}"`, `"${(p.address || '').replace(/"/g, '""')}"`, `"${p.lat}"`, `"${p.lng}"`,
          `"${(p.memo || '').replace(/"/g, '""')}"`, `"${p.flagged ? 'TRUE' : 'FALSE'}"`
        ]);
        content = "\uFEFF" + [headers.map(h => `"${h}"`), ...rows].map(e => e.join(",")).join("\n");
        mimeType = 'text/csv;charset=utf-8;';
        filename = `BukkenMemo_${dateStr}.csv`;
      }

      // BlobではなくFileオブジェクトを生成し、lastModified（更新時刻）を明示的に現在時刻に設定
      const file = new File([content], filename, {
        type: mimeType,
        lastModified: Date.now()
      });
      const url = URL.createObjectURL(file);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 1000);
    };

    window.importData = function(event) {
      document.getElementById('settings-menu').classList.add('hidden');
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          let count = 0;
          data.forEach(item => {
            if (item.id && typeof item.lat === 'number' && typeof item.lng === 'number' && item.name) {
              if (!properties.find(p => p.id === item.id)) {
                item.isDeleted = false;
                properties.push(item);
                count++;
              }
            }
          });
          
          if(count > 0) {
            saveToLocal();
            renderList();
            renderMapMarkers();
            customAlert(`データを復元しました。\n新規追加: ${count}件`);
          } else {
            customAlert('新しいデータはありませんでした。');
          }
        } catch (err) {
          customAlert("ファイルの読み込みに失敗しました。\n正しいJSONファイルを選択してください。");
        }
        event.target.value = ''; 
      };
      reader.readAsText(file);
    };
  </script>
</body>
</html>
